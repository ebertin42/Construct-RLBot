# FROM-SCRATCH auto-curriculum -- Option A (2026-07-23).
#
# Conclusion after days: fine-tuning the champion CANNOT improve it. It is a sharp
# self-play local optimum; strong anchor keeps it capped, weak/no anchor degrades
# it, win-prob shaping is gameable, goal reward still drifts down. A comparable-size
# net (Element, 400k) beats us 96-0, so the ceiling is the RECIPE, not the model --
# but that better recipe is not reachable from our champion.
#
# So: train a FRESH net from ZERO against a real graded opponent. No champion, no
# anchor, no local-optimum baggage, and (unlike the champion) a real external
# opponent from step 0 -- so it never enters the self-play collapse the champion
# is trapped in. The auto-curriculum handles the cold-start: the opponent starts
# nearly idle (period 12) so even a random net can score, and ratchets up as the
# policy learns. 65% self-play gives dense practice alongside.
#
# Launch: `python -m construct.learn.train configs/train_v8_fromscratch.toml`
# (fresh net, UNBOUNDED). This is a long run -- monitor bootstrap via the ladder.
#
# Reward: reward_v0 (goal + touch + vel_to_ball) -- a proven SHAPED reward that
# bootstraps a random net. The auto-curriculum controller does NOT read this
# reward (dense shaping isn't zero-sum); it measures a clean GOAL-based win rate on
# a SEPARATE eval engine, so the training reward can be shaped while the curriculum
# signal stays honest. This is the fix for the win-prob-gaming trap.
schema_path = "schema/v1.toml"
# reward_v0 + team_spirit (a no-op in 1v1, see the config's own proof): needed
# because the run now trains some 2v2/3v3 arenas, where reward_v0's team_spirit=0
# would pay every car only for its own touches and teach three bots to chase the
# same ball. The gate/benches keep using reward_v0 as their untouched tape.
reward_config_path = "configs/reward_v8_team.toml"
curriculum_config_path = "configs/curriculum_v3_match.toml"

[env]
num_arenas = 192
blue = 1
orange = 1
seed = 0
# 2026-07-25: a MODEST team share, so the policy keeps seeing teammates instead of
# specialising into 1v1 and having to be re-taught later. Sized so the external
# opponents are untouched: arenas are laid out in 1v1/2v2/3v3 blocks and foreign
# opponents take the FRONT, so with 0.7*192 = 134 1v1 arenas the 77 foreign arenas
# (opponent_frac 0.40) still all land on 1v1. Only SELF-PLAY arenas convert to team
# play. Equal weights [1,1,1] would leave 64 1v1 arenas -- fewer than the 77 needed
# -- and the engine hard-errors ("ported bots are 1v1-only"), because Immortal's
# and Element's obs width is fixed to 1v1. Nexto's and Necto's obs builders ARE
# team-size generic, so relaxing that guard per-kind is the route to real 2v2/3v3
# opponents (and a 2v2 gate) later.
team_size_weights = [0.7, 0.2, 0.1]

[net]
d_model = 128
layers = 2
heads = 4
ff = 512

[ppo]
rollout_steps = 256
gamma = 0.9954
lam = 0.95
lr = 3e-4                # a touch higher than the fine-tune 2e-4: from scratch
clip = 0.2
entropy_coef = 0.01
value_coef = 1.0
epochs = 3
minibatch_size = 8192

[run]
device = "cuda"
checkpoint_dir = "checkpoints_scratch"
save_every_iters = 20
log_every_iters = 1

# 2026-07-24: ALL FOUR ported bots in the loop (was Element-only). The engine
# round-robins foreign arenas across these slots (`-(i % slots) - 2`), so each bot
# gets ~1/4 of the foreign arenas. Roster + ordering come from the earlier
# bot-vs-bot / difficulty benchmarks (logs/version_ladder.tsv, opponent_ladder.tsv):
# period dominates difficulty, so the auto-curriculum keeps ONE shared period knob
# across all four bots and holds ~50% win-rate vs the MIX. Diversity (Element MLP +
# Immortal + Necto + Nexto EARL) hardens the net against a single opponent's quirks.
# decision_periods start at 6 (not the Element-only p3-4 equilibrium): the 4-bot mix
# is harder on average, so start winnable and let the curriculum tighten.
[foreign]
enabled = true
kinds = ["element", "immortal", "necto", "nexto"]
weights = [
    "~/.cache/construct/element_weights.npz",
    "~/.cache/construct/immortal_weights.npz",
    "~/.cache/construct/necto_weights.npz",
    "~/.cache/construct/nexto_weights.npz",
]
# PER-BOT periods (2026-07-25), seeded from a 48-match bench of ck_001171502080
# with all four at a shared p4: immortal 0.896, element 0.677, necto 0.615,
# nexto 0.146. Difficulty is NOT ordered like the bot-vs-bot ladder -- vs OUR net
# immortal is the easiest and nexto is by far the hardest -- so a shared period
# parks immortal as a punching bag and nexto as an unwinnable wall, and only
# element/necto produce useful gradient. Seed the two outliers one rung toward
# the band (immortal harder, nexto easier) and let the per-slot controller tune
# each from its own measured win rate.
decision_periods = [4, 3, 4, 5]   # element, immortal, necto, nexto
# 0.40 -> 0.55 (2026-07-25), sized by share of LEARNER EXPERIENCE, not arenas.
# A foreign arena yields ONE learner row (its opponent is bot-driven and does not
# learn) while a 2v2/3v3 self-play arena yields 4-6. So after adding team arenas the
# external-bot signal had quietly fallen from 25.1% to 16.6% of experience even
# though its arena count was unchanged -- and that signal is what broke the 1v1
# plateau. 0.55 = 106 of the 134 1v1 arenas, restoring external bots to ~24.4% while
# team play stays ~63%. The cost falls on 1v1 SELF-PLAY (24.6% -> 12.9%), which is
# the least valuable regime in the mix: unopposed 1v1 self-play is exactly what
# produced the trapped champion. Ceiling is the 1v1 arena count (foreign is
# 1v1-only), i.e. frac <= 134/192 = 0.69 at these team weights.
opponent_frac = 0.55

[foreign.auto_curriculum]
enabled = true
band = 5.0                 # normalised ~= 10 * avg net goals/foreign-arena/rollout
period_min = 1
period_max = 12
adjust_every = 20          # measure win rate + adjust every 20 iters
ema_alpha = 0.2            # ep_rew fallback only
# Per-bot target band. WIDER than the old +/-0.05 on purpose: one eval scores only
# ~18 matches per bot, so a single measurement's sd is ~0.118 -- more than double a
# 0.05 half-width. With the narrow band the controller moved on ~85-90% of evals
# and wandered 4 rungs (the logged period became noise). [0.35,0.65] is wider than
# 1 sd of the measurement, still nowhere near saturated (both sides keep scoring),
# and with adjust_dwell below the simulated move rate falls to 0.11-0.22 with the
# period settling into a 2-rung band at the same ~0.5 mean win rate.
win_lo = 0.35
win_hi = 0.65
adjust_dwell = 2           # evals a bot must hold still after a change before
                           # moving again (lets its reset EMA re-accumulate)
# Eval arenas are round-robined across the foreign slots (like the training
# assignment), so EVERY bot is measured -- before 2026-07-25 the eval collected
# with slot 0 only, leaving the controller blind to bots 2..N. Keep this a
# MULTIPLE of the bot count so each gets the same number of arenas: 24/4 = 6
# arenas per bot -> ~18 matches per bot per eval at eval_steps below.
eval_arenas = 24
wr_ema_alpha = 0.3         # per-slot win-rate smoothing (few matches per bot per
                           # eval); reset for a slot whenever its period changes
# The eval runs in MATCH_MODE (same regime as training + bench). A match only ends
# at 300s (~4500 steps), so eval_steps must span several full matches or NO match
# completes and the win-rate signal is None (silently falling back to the gameable
# ep_rew EMA). 14000 -> ~3 matches/arena x 16 arenas ~= 48 matches. Fixed 2026-07-23
# alongside the goal-terminated->match_mode eval fix in train.py.
eval_steps = 14000
